<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard · Picnic Denise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #fff8ee;
      --ink: #3d3429;
      --ink-soft: #6b5f52;
      --coral: #ff6b6b;
      --sage: #81b29a;
      --sage-dark: #5a9078;
      --lavender: #c77dff;
      --border: #e8ddd0;
      --white: #fffcf7;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Lato", system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      padding: 1.25rem;
      line-height: 1.5;
    }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
    }

    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.65rem;
      color: var(--ink);
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--ink-soft);
      margin-top: 0.25rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .btn {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.55rem 1rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: var(--coral);
      color: white;
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn:hover { transform: scale(1.03); }
    .btn:disabled { opacity: 0.5; cursor: wait; transform: none; }

    .btn-ghost {
      background: white;
      color: var(--ink-soft);
      border: 1px solid var(--border);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .stat {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
    }

    .stat-num {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--coral);
      line-height: 1.1;
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--ink-soft);
      margin-top: 0.2rem;
    }

    section {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem;
      margin-bottom: 1.25rem;
    }

    section h2 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.15rem;
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .badge {
      font-family: "Lato", sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      background: #f0fff4;
      color: var(--sage-dark);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
    }

    .empty {
      font-size: 0.9rem;
      color: var(--ink-soft);
      font-style: italic;
      padding: 0.5rem 0;
    }

    .error-box {
      background: #ffe0e0;
      color: #a33;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.88rem;
      margin-bottom: 1rem;
    }

    .rsvp-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      margin-bottom: 0.65rem;
      background: var(--white);
    }

    .rsvp-card:last-child { margin-bottom: 0; }

    .rsvp-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.35rem;
      margin-bottom: 0.4rem;
    }

    .rsvp-name {
      font-weight: 700;
      font-size: 1rem;
    }

    .rsvp-meta {
      font-size: 0.78rem;
      color: var(--ink-soft);
    }

    .rsvp-items {
      font-size: 0.88rem;
      color: var(--ink);
    }

    .rsvp-items.none { color: var(--ink-soft); font-style: italic; }

    .msg-card {
      border-left: 3px solid var(--lavender);
      background: #faf5ff;
      border-radius: 0 10px 10px 0;
      padding: 0.85rem 1rem;
      margin-bottom: 0.65rem;
    }

    .msg-card:last-child { margin-bottom: 0; }

    .msg-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.35rem;
      margin-bottom: 0.35rem;
    }

    .msg-name { font-weight: 700; font-size: 0.95rem; }

    .msg-date {
      font-size: 0.75rem;
      color: var(--ink-soft);
    }

    .msg-text {
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .totals-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .total-chip {
      font-size: 0.78rem;
      padding: 0.3rem 0.55rem;
      border-radius: 999px;
      background: #f5f5f5;
      border: 1px solid var(--border);
    }

    .total-chip.full {
      text-decoration: line-through;
      opacity: 0.55;
    }

    .status {
      font-size: 0.82rem;
      color: var(--ink-soft);
    }

    .status.live { color: var(--sage-dark); }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--ink-soft);
      padding: 1rem 0 0.5rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Dashboard · Picnic Denise</h1>
        <p class="subtitle">RSVPs, cosas a llevar y mensajes · solo para ti</p>
      </div>
      <div class="actions">
        <span id="status" class="status">Cargando…</span>
        <button type="button" class="btn btn-ghost" id="copy-msgs-btn" disabled>Copiar mensajes</button>
        <button type="button" class="btn" id="refresh-btn">Actualizar</button>
      </div>
    </header>

    <div id="error" class="error-box hidden" style="display:none;"></div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="stat-rsvps">—</div>
        <div class="stat-label">Confirmaciones</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-guests">—</div>
        <div class="stat-label">Personas en total</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-msgs">—</div>
        <div class="stat-label">Mensajes</div>
      </div>
    </div>

    <section>
      <h2>Resumen de cosas <span class="badge" id="totals-badge">0 ítems</span></h2>
      <div class="totals-grid" id="totals-grid">
        <span class="empty">Cargando…</span>
      </div>
    </section>

    <section>
      <h2>Confirmaciones <span class="badge" id="rsvp-badge">0</span></h2>
      <div id="rsvp-list"><p class="empty">Cargando…</p></div>
    </section>

    <section>
      <h2>Mensajes para Denise <span class="badge" id="msg-badge">0</span></h2>
      <div id="msg-list"><p class="empty">Cargando…</p></div>
    </section>

    <footer>Actualizado: <span id="updated-at">—</span></footer>
  </div>

  <script>
    const SUPABASE_URL = "https://qhattugoalnjunycqpcr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_JAqa9wTswoNaHIQaIK5l6Q_s55Dp3Ue";
    const RSVPS_TABLE = "picnic_rsvps";
    const MESSAGES_TABLE = "picnic_messages";

    const ITEMS = [
      { id: "papas",    emoji: "🍿", label: "Bolsas de papas",     unit: "bolsas",   max: 3 },
      { id: "bebidas",  emoji: "🧃", label: "Bebidas",             unit: "",         max: 4 },
      { id: "galletas", emoji: "🍪", label: "Galletas",            unit: "paquetes", max: 2 },
      { id: "hummus",   emoji: "🥙", label: "Hummus",              unit: "",         max: 1 },
      { id: "queso",    emoji: "🧀", label: "Queso y crackers",    unit: "",         max: 2 },
      { id: "fruta",    emoji: "🍓", label: "Fruta / fresas",      unit: "",         max: 5 },
      { id: "agua",     emoji: "🥤", label: "Agua fresca",         unit: "",         max: 3 },
      { id: "manta",    emoji: "🧺", label: "Manta para el pasto", unit: "",         max: null },
      { id: "otro",     emoji: "✨", label: "Otro",                unit: "",         max: null }
    ];

    let supabaseClient = null;
    let messagesCache = [];

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function formatDate(iso) {
      if (!iso) return "—";
      try {
        return new Date(iso).toLocaleString("es-MX", {
          dateStyle: "medium",
          timeStyle: "short"
        });
      } catch {
        return iso;
      }
    }

    function formatItems(items) {
      if (!items) return null;
      const parts = [];
      ITEMS.forEach(item => {
        const q = items[item.id];
        if (q > 0) {
          let txt = item.emoji + " " + item.label;
          if (q > 1) txt += " ×" + q;
          parts.push(txt);
        }
      });
      return parts.length ? parts : null;
    }

    function computeTotals(rsvps) {
      const totals = {};
      ITEMS.forEach(i => { totals[i.id] = 0; });
      rsvps.forEach(r => {
        if (!r.items) return;
        ITEMS.forEach(item => {
          if (r.items[item.id] > 0) totals[item.id] += r.items[item.id];
        });
      });
      return totals;
    }

    function loadSupabaseLib() {
      return new Promise((resolve) => {
        if (window.supabase && typeof window.supabase.createClient === "function") {
          resolve(true);
          return;
        }
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
        s.onload = () => resolve(true);
        s.onerror = () => resolve(false);
        document.head.appendChild(s);
      });
    }

    function initClient() {
      if (supabaseClient) return true;
      if (!window.supabase) return false;
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return true;
    }

    function showError(msg) {
      const el = document.getElementById("error");
      el.textContent = msg;
      el.style.display = "block";
    }

    function hideError() {
      document.getElementById("error").style.display = "none";
    }

    function renderTotals(rsvps) {
      const totals = computeTotals(rsvps);
      const grid = document.getElementById("totals-grid");
      let active = 0;
      const chips = ITEMS.map(item => {
        const count = totals[item.id] || 0;
        if (count <= 0) return "";
        active++;
        const maxPart = item.max != null ? " / " + item.max : "";
        const full = item.max != null && count >= item.max;
        return `<span class="total-chip${full ? " full" : ""}">${item.emoji} ${item.label}: ${count}${maxPart}</span>`;
      }).filter(Boolean);

      document.getElementById("totals-badge").textContent = active + " con pedidos";
      grid.innerHTML = chips.length
        ? chips.join("")
        : '<span class="empty">Nadie ha elegido qué llevar todavía</span>';
    }

    function renderRsvps(rsvps) {
      const list = document.getElementById("rsvp-list");
      document.getElementById("rsvp-badge").textContent = rsvps.length;

      if (!rsvps.length) {
        list.innerHTML = '<p class="empty">Nadie ha confirmado todavía</p>';
        return;
      }

      list.innerHTML = rsvps.map(r => {
        const parts = formatItems(r.items);
        const guests = r.guest_count || 1;
        return `<article class="rsvp-card">
          <div class="rsvp-head">
            <span class="rsvp-name">${escapeHtml(r.name)}</span>
            <span class="rsvp-meta">${guests} ${guests === 1 ? "persona" : "personas"} · ${formatDate(r.updated_at)}</span>
          </div>
          <p class="rsvp-items${parts ? "" : " none"}">${parts ? escapeHtml(parts.join(", ")) : "No eligió qué llevar"}</p>
        </article>`;
      }).join("");
    }

    function renderMessages(messages) {
      messagesCache = messages;
      const list = document.getElementById("msg-list");
      document.getElementById("msg-badge").textContent = messages.length;
      document.getElementById("copy-msgs-btn").disabled = messages.length === 0;

      if (!messages.length) {
        list.innerHTML = '<p class="empty">Todavía no hay mensajes</p>';
        return;
      }

      list.innerHTML = messages.map(m => `
        <article class="msg-card">
          <div class="msg-head">
            <span class="msg-name">${escapeHtml(m.name)}</span>
            <span class="msg-date">${formatDate(m.created_at)}</span>
          </div>
          <p class="msg-text">${escapeHtml(m.message)}</p>
        </article>
      `).join("");
    }

    function renderStats(rsvps, messages) {
      const guests = rsvps.reduce((sum, r) => sum + (r.guest_count || 1), 0);
      document.getElementById("stat-rsvps").textContent = rsvps.length;
      document.getElementById("stat-guests").textContent = guests;
      document.getElementById("stat-msgs").textContent = messages.length;
    }

    async function loadData() {
      const status = document.getElementById("status");
      const btn = document.getElementById("refresh-btn");
      status.textContent = "Cargando…";
      status.classList.remove("live");
      btn.disabled = true;
      hideError();

      const ok = await loadSupabaseLib();
      if (!ok || !initClient()) {
        showError("No se pudo conectar con Supabase. Revisa tu red o recarga la página.");
        status.textContent = "Error";
        btn.disabled = false;
        return;
      }

      const [rsvpRes, msgRes] = await Promise.all([
        supabaseClient.from(RSVPS_TABLE).select("*").order("updated_at", { ascending: false }),
        supabaseClient.from(MESSAGES_TABLE).select("*").order("created_at", { ascending: false })
      ]);

      btn.disabled = false;

      if (rsvpRes.error || msgRes.error) {
        console.error(rsvpRes.error || msgRes.error);
        showError("Error al leer datos. ¿Corriste el SQL en Supabase?");
        status.textContent = "Error";
        return;
      }

      const rsvps = rsvpRes.data || [];
      const messages = msgRes.data || [];

      renderStats(rsvps, messages);
      renderTotals(rsvps);
      renderRsvps(rsvps);
      renderMessages(messages);

      document.getElementById("updated-at").textContent = new Date().toLocaleString("es-MX", {
        dateStyle: "medium",
        timeStyle: "short"
      });
      status.textContent = "En vivo";
      status.classList.add("live");
    }

    function copyMessages() {
      if (!messagesCache.length) return;
      const text = messagesCache.map(m =>
        "— " + m.name + " —\n" + m.message
      ).join("\n\n");
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("copy-msgs-btn");
        const orig = btn.textContent;
        btn.textContent = "¡Copiado!";
        setTimeout(() => { btn.textContent = orig; }, 2000);
      }).catch(() => alert("No se pudo copiar. Selecciona los mensajes manualmente."));
    }

    document.getElementById("refresh-btn").addEventListener("click", loadData);
    document.getElementById("copy-msgs-btn").addEventListener("click", copyMessages);
    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
</html>
